LogLevel warn
MaxLogSize 1048576
Listen 0.0.0.0:631
Listen /run/cups/cups.sock
Browsing Off
WebInterface Yes
DefaultAuthType Basic
DefaultEncryption IfRequested
ServerAlias localhost printserver

<Location />

  Order deny,allow
  Deny from all
  Allow from localhost
  Allow from 10.0.0.0/8
  Allow from 172.16.0.0/12
  Allow from 192.168.0.0/16
</Location>


<Location /jobs>

  Order deny,allow
  Deny from all
  Allow from localhost
  Allow from 10.0.0.0/8
  Allow from 172.16.0.0/12
  Allow from 192.168.0.0/16
</Location>


<Location /printers>

  Order deny,allow
  Deny from all
  Allow from localhost
  Allow from 10.0.0.0/8
  Allow from 172.16.0.0/12
  Allow from 192.168.0.0/16
</Location>


<Location /admin>
  AuthType Default
  Require user print root
  Order deny,allow
  Deny from all
  Allow from localhost
  Allow from 10.0.0.0/8
  Allow from 172.16.0.0/12
  Allow from 192.168.0.0/16
</Location>


<Location /admin/conf>
  AuthType Default
  Require user print root
  Order deny,allow
  Deny from all
  Allow from localhost
  Allow from 10.0.0.0/8
  Allow from 172.16.0.0/12
  Allow from 192.168.0.0/16
</Location>


<Location /admin/log>
  AuthType Default
  Require user print root
  Order deny,allow
  Deny from all
  Allow from localhost
  Allow from 10.0.0.0/8
  Allow from 172.16.0.0/12
  Allow from 192.168.0.0/16
</Location>

<Policy default>
  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
  </Limit>
  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes CUPS-Move-Job Cancel-Job>
    Require user @OWNER print root
    Order deny,allow
  </Limit>
  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user print root
    Order deny,allow
  </Limit>
  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
